<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
    <div class="max-w-7xl mx-auto px-6 py-12">

    <!-- Title -->
    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-gray-800">Contact Us</h1>
        <p class="text-gray-500 mt-2">We’d love to hear from you!</p>
    </div>

    <div class="grid md:grid-cols-2 gap-10">

        <!-- Contact Info -->
        <div class="bg-white p-8 rounded-xl shadow">
            <h2 class="text-2xl font-bold mb-6">Get in Touch</h2>

            <p class="mb-4 text-gray-600">
                📧 <span class="font-semibold">Email:</span> your@email.com
            </p>

            <p class="mb-4 text-gray-600">
                📞 <span class="font-semibold">Phone:</span> 012345678
            </p>

            <p class="mb-4 text-gray-600">
                📍 <span class="font-semibold">Address:</span> Phnom Penh, Cambodia
            </p>

            <!-- Social -->
            <div class="flex gap-4 mt-6">
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Facebook
                </button>
                <button class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-black">
                    Telegram
                </button>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="bg-white p-8 rounded-xl shadow">
            <h2 class="text-2xl font-bold mb-6">Send Message</h2>

            <form>
                <div class="mb-4">
                    <label class="block mb-1 font-medium">Name</label>
                    <input type="text" 
                        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Your Name">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-medium">Email</label>
                    <input type="email" 
                        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Your Email">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-medium">Message</label>
                    <textarea 
                        class="w-full border rounded-lg px-4 py-2 h-32 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Your Message"></textarea>
                </div>

                <button 
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 w-full">
                    Send Message
                </button>
            </form>
        </div>

    </div>

    <!-- Map Section -->
    <div class="mt-12">
        <iframe 
            class="w-full h-80 rounded-xl shadow"
            src="https://maps.google.com/maps?q=phnom%20penh&t=&z=13&ie=UTF8&iwloc=&output=embed">
        </iframe>
    </div>

</div>

</div>
</body>
</html>
