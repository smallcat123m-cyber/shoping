<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop Pro</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.fade {
    animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
    from { opacity:0; transform: translateY(10px);}
    to { opacity:1; transform: translateY(0);}
}
</style>
</head>

<body class="bg-black text-white">

<!-- NAVBAR -->
<nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-white/10 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <div class="text-2xl font-bold cursor-pointer"
            onclick="loadPage('home.html')">MyShop</div>

        <ul class="flex gap-6 items-center">
            <li><a href="#" onclick="loadPage('men.html')" class="hover:text-pink-400">Men</a></li>
            <li><a href="#" onclick="loadPage('women.html')" class="hover:text-pink-400">Women</a></li>
            <li><a href="#" onclick="loadPage('cart.html')" class="hover:text-pink-400">Cart</a></li>
            <li><a href="#" onclick="loadPage('couple.html')" class="hover:text-pink-400">Couple</a></li>

            <li>
                <a href="#" onclick="loadPage('Login.html')"
                   class="bg-gradient-to-r from-pink-500 to-red-500 px-4 py-2 rounded-full">
                   Login
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- CONTENT -->
<div id="content"></div>

<script>
function loadPage(page) {
    fetch(page)
    .then(res => res.text())
    .then(data => {

        const content = document.getElementById("content");
        const navbar = document.querySelector("nav");

        content.innerHTML = data;
        content.className = "fade";

        if(page === 'Login.html'){
            navbar.style.display = "none";
            content.classList.add("w-screen","h-screen");
        }else{
            navbar.style.display = "block";
            content.classList.add("max-w-7xl","mx-auto","pt-28","px-6");
        }

        window.scrollTo({top:0});
    });
}

window.onload = () => loadPage('home.html');
</script>

</body>
</html>
