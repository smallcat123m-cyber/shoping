<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop SPA</title>
    <link rel="stylesheet" href="../src/output.css">
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <!-- Logo -->
            <div class=" font-bold text-xl">
                <a href="#" onclick="loadPage('home.html')">My Shop</a>
            </div>

            <div class="relative">

                <input type="search" placeholder="Search..."
                    class="pl-10 pr-4 py-2 border rounded-lg w-48 md:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">

                <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>

            </div>

            <!-- Menu -->
            <ul class="flex gap-6 items-center font-medium">
                <li><a href="#" onclick="loadPage('men.html')" class="hover:text-blue-600">Men </a></li>
                <li><a href="#" onclick="loadPage('women.html')" class="hover:text-blue-600">Women</a></li>
                <li><a href="#" onclick="loadPage('couple.html')" class="hover:text-blue-600">Couple </a></li>
                <li><a href="#" onclick="loadPage('cart.html')" class="hover:text-blue-600">Cart </a></li>
                <li><a href="#" onclick="loadPage('About.html')" class="hover:text-blue-600">About</a></li>
                <li><a href="#" onclick="loadPage('Contact.html')" class="hover:text-blue-600">Contact</a></li>
                <li><a href="#" onclick="loadPage('Login.html')" class="hover:text-blue-600">Login</a></li>
            </ul>

        </div>
    </nav>

    <!-- Dynamic Content -->
    <div id="content"></div>

    <!-- JS -->
    <script>
        function loadPage(page) {
            fetch(page)
                .then(res => res.text())
                .then(data => {
                    document.getElementById("content").innerHTML = data;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(err => console.log(err));
        }

        // Load home by default
        window.onload = function () {
            loadPage('home.html');
        }
    </script>

</body>

</html>
