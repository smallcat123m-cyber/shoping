<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
    
    <h1 class=" text-center text-4xl ">ខ្លឹម ចាន់សុវណ្ណរ័ត្ន <br> make the couple page</h1>
    <div class="fade">

    <!-- HEADER -->
    <div class="mb-10 text-center">
        <h1 class="text-4xl font-bold mb-3">Couple Collection ❤️</h1>
        <p class="text-gray-400">Perfect outfits for you and your partner</p>
    </div>

    <!-- GRID -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">

        <!-- ITEM 1 -->
        <div class="group bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:scale-105 transition duration-300">

            <div class="relative">
                <img src="https://images.unsplash.com/photo-1520975922284-9c4f4c63c8d3"
                     class="h-64 w-full object-cover">

                <!-- badge -->
                <span class="absolute top-3 left-3 bg-pink-500 text-sm px-3 py-1 rounded-full">
                    Best Seller
                </span>

                <!-- overlay -->
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                    <button class="bg-white text-black px-4 py-2 rounded-full">
                        View
                    </button>
                </div>
            </div>

            <div class="p-4">
                <h2 class="text-lg font-semibold">Matching Hoodie Set</h2>
                <p class="text-gray-400 text-sm">Cute & Comfortable</p>
                <p class="mt-2 text-pink-400 font-bold">$60</p>
            </div>
        </div>

        <!-- ITEM 2 -->
        <div class="group bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:scale-105 transition duration-300">

            <div class="relative">
                <img src="https://images.unsplash.com/photo-1519741497674-611481863552"
                     class="h-64 w-full object-cover">

                <span class="absolute top-3 left-3 bg-purple-500 text-sm px-3 py-1 rounded-full">
                    New
                </span>

                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                    <button class="bg-white text-black px-4 py-2 rounded-full">
                        View
                    </button>
                </div>
            </div>

            <div class="p-4">
                <h2 class="text-lg font-semibold">Couple T-Shirts</h2>
                <p class="text-gray-400 text-sm">Minimal Style</p>
                <p class="mt-2 text-pink-400 font-bold">$35</p>
            </div>
        </div>

        <!-- ITEM 3 -->
        <div class="group bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:scale-105 transition duration-300">

            <div class="relative">
                <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c"
                     class="h-64 w-full object-cover">

                <span class="absolute top-3 left-3 bg-red-500 text-sm px-3 py-1 rounded-full">
                    Hot 🔥
                </span>

                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                    <button class="bg-white text-black px-4 py-2 rounded-full">
                        View
                    </button>
                </div>
            </div>

            <div class="p-4">
                <h2 class="text-lg font-semibold">Streetwear Set</h2>
                <p class="text-gray-400 text-sm">Trendy Look</p>
                <p class="mt-2 text-pink-400 font-bold">$75</p>
            </div>
        </div>

    </div>

</div>
</body>
</html>
