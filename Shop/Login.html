<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">

</head>
<body>
    <div class="w-full min-h-screen flex bg-black">

    <!-- LEFT IMAGE -->
    <div class="hidden md:block w-1/2 relative">
        <img src="https://images.unsplash.com/photo-1520975922284-9c4f4c63c8d3"
             class="w-full h-full object-cover">

        <div class="absolute inset-0 bg-gradient-to-r from-black/80 to-transparent flex items-center px-12">
            <div>
                <h1 class="text-5xl font-bold mb-4">MyShop Pro</h1>
                <p class="text-gray-300 text-lg">
                    Premium shopping experience for modern lifestyle
                </p>
            </div>
        </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="w-full md:w-1/2 flex items-center justify-center px-6">

        <div class="w-full max-w-md p-8 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-xl">

            <!-- TITLE -->
            <div class="mb-6 text-center">
                <h2 class="text-3xl font-bold">Welcome Back 👋</h2>
                <p class="text-gray-400 text-sm">Login to your account</p>
            </div>

            <!-- FORM -->
            <form>

                <!-- EMAIL -->
                <div class="mb-4">
                    <label class="text-sm text-gray-300">Email</label>
                    <input type="email" placeholder="Enter your email"
                        class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-white/10 focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="text-sm text-gray-300">Password</label>
                    <input type="password" placeholder="Enter your password"
                        class="w-full mt-1 px-4 py-3 rounded-lg bg-black/40 border border-white/10 focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>

                <!-- OPTIONS -->
                <div class="flex justify-between items-center text-sm mb-6">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" class="accent-pink-500">
                        Remember me
                    </label>
                    <a href="#" class="text-pink-400 hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- BUTTON -->
                <button type="submit"
                    class="w-full py-3 rounded-lg bg-gradient-to-r from-pink-500 to-red-500 hover:scale-105 transition">
                    Login
                </button>

            </form>

            <!-- DIVIDER -->
            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="px-3 text-gray-400 text-sm">OR</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- SOCIAL -->
            <div class="flex gap-3">
                <button class="flex-1 bg-white/10 py-2 rounded-lg hover:bg-white/20">
                    Google
                </button>
                <button class="flex-1 bg-white/10 py-2 rounded-lg hover:bg-white/20">
                    Facebook
                </button>
            </div>

            <!-- SIGN UP -->
            <p class="text-center text-sm text-gray-400 mt-6">
                Don't have an account?
                <a href="#" class="text-pink-400 hover:underline">Sign up</a>
            </p>

        </div>

    </div>

</div>
</body>
</html>
